<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mail-Übersicht</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%234f46e5' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3E%3Crect x='3' y='5' width='18' height='14' rx='2'/%3E%3Cpath d='m3 7 9 6 9-6'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
      <h1>Mail-Übersicht</h1>
    </div>
    <span id="status" class="status" role="status" aria-live="polite"></span>
    <span class="spacer"></span>
    <button id="compose-link" class="btn primary" type="button" data-icon="pencil" title="Neue Mail schreiben und senden">Neue Mail</button>
    <button id="outbox-link" class="btn ghost" type="button" data-icon="send" title="Entwürfe und geplante Mails"><span>Entwürfe</span><span id="outbox-badge" class="nav-badge" hidden></span></button>
    <span class="menu-wrap" id="options-wrap">
      <button id="options-link" class="btn ghost" type="button" data-icon="sliders" aria-haspopup="menu" aria-expanded="false" title="Kontakte, Lernen und Regeln">Optionen</button>
      <div id="options-menu" class="menu" role="menu" hidden>
        <button id="contacts-link" class="menu-item" type="button" role="menuitem" data-icon="users" title="Adressbuch: Vorschläge bei An, CC und BCC">Kontakte</button>
        <button id="learn-link" class="menu-item" type="button" role="menuitem" data-icon="lightbulb" title="Aus gesendeten Mails Regeln und Gewohnheiten lernen">Lernen</button>
        <button id="rules-link" class="menu-item" type="button" role="menuitem" data-icon="book" title="Regeln für Entwürfe, Dringlichkeit und Absender bearbeiten">Regeln</button>
      </div>
    </span>
    <button id="notify" class="btn ghost icon-only" type="button" hidden></button>
    <button id="refresh" class="btn ghost" type="button" data-icon="refresh" title="Jetzt neu laden">Aktualisieren</button>
  </header>

  <main class="layout">
    <section class="list-pane" aria-label="Mails">
      <div class="list-head">
        <div class="search-row">
          <label class="search">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
            <input id="search" type="search" placeholder="Suchen: Absender, Betreff, Inhalt, Dokumente" autocomplete="off" aria-label="Mails durchsuchen">
            <kbd>/</kbd>
            <button id="search-clear" class="clear" type="button" aria-label="Suche leeren" hidden>×</button>
          </label>
          <button id="filter-toggle" class="filter-btn" type="button" title="Erweiterte Suche: Person, Zeitraum, Anhang, Dokumente …" aria-expanded="false" aria-controls="filter-panel" aria-label="Filter"><span class="filter-icon"></span><span class="filter-count"></span></button>
        </div>
        <div id="filter-panel" class="filter-panel" hidden></div>
        <div id="filter-chips" class="filter-chips" hidden></div>
        <div id="tabs" class="chips" role="tablist" aria-label="Ansicht"></div>
      </div>
      <div id="mark-bar" class="mark-bar" role="toolbar" aria-label="Markierte Mails" hidden></div>
      <div id="list" class="mail-list" role="listbox" aria-label="Mailliste"></div>
    </section>

    <section id="detail" class="detail-pane" aria-live="polite"></section>
  </main>

  <div id="toast" class="toast" role="status" hidden></div>
  <script type="module" src="/js/main.js"></script>
</body>
</html>
